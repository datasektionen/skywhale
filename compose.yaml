services:
  app:
    build: .
    ports: [ 8080:8080 ]
    environment:
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=debug
      - APP_ENV=debug
      - APP_KEY=12345678901234567890abcdefabcdea
      - APP_DEBUG=true
      - APP_LOG_LEVEL=debug
      - APP_URL=http://localhost:8080
      - SESSION_DRIVER=cookie
      - DB_CONNECTION=pgsql
      - DB_DRIVER=pgsql
      - DB_HOST=db
      - DB_DATABASE=skywhale
      - DB_USERNAME=skywhale
      - DB_PASSWORD=skywhale
      - SSO_API_URL=http://nyckeln:7003
      - OIDC_PROVIDER=http://nyckeln:7003
      - OIDC_ID=client-id
      - OIDC_SECRET=client-secret
      - REDIRECT_URL=http://localhost:8080/login-complete
      - RFINGER_API_KEY=0
      - RFINGER_API_URL=http://dock:9003/api
      - PORT=8080
    configs:
      - source: nginx.conf
        target: /etc/nginx/http.d/http_proxy.conf
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore: [vendor/]
        - action: rebuild
          path: composer.json
  db:
    image: postgres:18-alpine
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=skywhale
      - POSTGRES_USER=skywhale
      - POSTGRES_DB=skywhale
    healthcheck:
      test:
        - "CMD-SHELL"
        - "sh -c 'pg_isready -d skywhale -U skywhale'"
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 10s
  nyckeln:
    image: ghcr.io/datasektionen/nyckeln-under-dorrmattan
    configs:
      - source: nyckeln.yaml
        target: /config.yaml
    ports:
      - 7002:7002
      - 7003:7003
      - 7004:7004
  dock:
    image: ghcr.io/datasektionen/dock:latest
    configs:
      - source: dock.yaml
        target: /config.yaml
    ports:
      - 9003:9003

configs:
  dock.yaml:
    content: |
      rfinger:
        default: http://localhost:9003
        pictures:
          turetek:
            regular: https://thskth.se/wp-content/uploads/2023/06/ths-logo-bla-01-300x294-1.png
            small: https://thskth.se/wp-content/uploads/2019/12/ths-logo-svart-01.png
          diadat:
            regular: https://dsekt-assets.s3.amazonaws.com/logotyp
            small: https://dsekt-assets.s3.amazonaws.com/logotyp
          marmed:
            regular: https://storage.googleapis.com/medieteknik-static/static/logos/logo.webp
            small: https://storage.googleapis.com/medieteknik-static/static/logos/logo.webp
          karklu:
            regular: https://dsekt-assets.s3.amazonaws.com/website/namnder/dkm.svg
            small: https://dsekt-assets.s3.amazonaws.com/website/namnder/dkm.svg

  nginx.conf:
    content: |
        server {
            listen 8080;
            root /var/www/html/public;
            index index.php;

            location / {
                try_files $$uri $$uri/ /index.php?$$query_string;
            }

            location ~ \.php$$ {
                fastcgi_pass 127.0.0.1:9000;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME $$document_root$$fastcgi_script_name;
                include fastcgi_params;
            }
        }

        server {
            listen 7003;

            location / {
                proxy_pass http://nyckeln:7003;
            }
        }

  nyckeln.yaml:
    content: |
      clients:
        - id: client-id
          secret: client-secret
          redirect_uris:
            - http://localhost:8080/login-complete
      users:
        - ug_kth_id: some-id
          kth_id: turetek
          email: turetek@kth.se
          first_name: Ture
          family_name: Teknolog
          year_tag: D-83
        - ug_kth_id: some-other-id
          kth_id: diadat
          email: diadat@kth.se
          first_name: Diana
          family_name: Datalog
          year_tag: D-83
        - ug_kth_id: yet-anouther-id
          kth_id: marmed
          email: marmed@kth.se
          first_name: Martin
          family_name: Median
          year_tag: M-00
        - ug_kth_id: even-more
          kth_id: karklu
          email: karklu@kth.se
          first_name: Karin
          family_name: Klubbare
          year_tag: D-85
      hive:
        tokens:
          - secret: spam-secret
            permissions:
              - id: send
          - secret: rfinger-secrect
            permissions:
              - id: get
        groups:
          - name: Valberedningens Ordförande
            id: valberedning-ordf
            domain: example.com
            members:
              - turetek
            permissions:
              - id: admin

